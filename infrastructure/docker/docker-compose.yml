version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: packing_postgres
    restart: always
    environment:
      POSTGRES_DB: packing_proof_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123!
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d packing_proof_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
